name: CI/CD Vite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # JOB 1: TEST
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

  # JOB 2: BUILD
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación
        run: npm run build

      - name: Guardar artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/

  # JOB 3: DEPLOY
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artifact para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
